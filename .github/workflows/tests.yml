name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Instalar dependências
        run: uv sync

      - name: Rodar testes com cobertura
        run: uv run pytest --cov=backend --cov-report=term-missing